name: CHINTU Android Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build CHINTU APK
    runs-on: ubuntu-24.04

    steps:

      # ==========================================
      # 1. CHECKOUT
      # ==========================================
      - name: Checkout source
        uses: actions/checkout@v4


      # ==========================================
      # 2. JAVA 17
      # ==========================================
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'


      # ==========================================
      # 3. ANDROID SDK
      # ==========================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 12266719
          accept-android-sdk-licenses: false
          packages: platform-tools


      # ==========================================
      # 4. ANDROID PLATFORM 35
      # ==========================================
      - name: Install Android Platform 35
        shell: bash
        run: |
          set -e

          SDKMANAGER="/usr/local/lib/android/sdk/cmdline-tools/16.0/bin/sdkmanager"

          echo "=========================================="
          echo "ANDROID SDK MANAGER"
          echo "=========================================="

          "$SDKMANAGER" --version

          echo ""
          echo "Installing Android Platform 35..."

          set +o pipefail
          yes | "$SDKMANAGER" "platforms;android-35"
          SDK_STATUS=$?
          set -o pipefail

          if [ "$SDK_STATUS" -ne 0 ]; then
            echo "Android Platform installation failed."
            exit "$SDK_STATUS"
          fi

          echo "Android Platform 35 installed."


      # ==========================================
      # 5. BUILD TOOLS
      # ==========================================
      - name: Install Android Build Tools 35
        shell: bash
        run: |
          set -e

          SDKMANAGER="/usr/local/lib/android/sdk/cmdline-tools/16.0/bin/sdkmanager"

          echo "Installing Android Build Tools 35.0.0..."

          set +o pipefail
          yes | "$SDKMANAGER" "build-tools;35.0.0"
          SDK_STATUS=$?
          set -o pipefail

          if [ "$SDK_STATUS" -ne 0 ]; then
            echo "Build Tools installation failed."
            exit "$SDK_STATUS"
          fi

          echo "Android Build Tools 35.0.0 installed."


      # ==========================================
      # 6. VERIFY SDK
      # ==========================================
      - name: Verify Android SDK
        shell: bash
        run: |
          set -e

          SDKMANAGER="/usr/local/lib/android/sdk/cmdline-tools/16.0/bin/sdkmanager"

          echo "=========================================="
          echo "INSTALLED ANDROID PACKAGES"
          echo "=========================================="

          "$SDKMANAGER" --list_installed


      # ==========================================
      # 7. SETUP GRADLE
      # ==========================================
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'


      # ==========================================
      # 8. PROJECT DIAGNOSTICS
      # ==========================================
      - name: CHINTU Project Diagnostics
        shell: bash
        run: |
          echo "=========================================="
          echo "CHINTU PROJECT DIAGNOSTICS"
          echo "=========================================="

          echo ""
          echo "Java version:"
          java -version

          echo ""
          echo "Gradle version:"
          gradle --version

          echo ""
          echo "Project files:"
          find . -maxdepth 7 -type f | sort

          echo ""
          echo "Kotlin source files:"
          find app/src -type f -name "*.kt" -o -name "*.kts" | sort

          echo ""
          echo "Android Manifest:"
          if [ -f app/src/main/AndroidManifest.xml ]; then
            cat app/src/main/AndroidManifest.xml
          else
            echo "AndroidManifest.xml NOT FOUND"
          fi


      # ==========================================
      # 9. COMPILE DEBUG KOTLIN ONLY
      # ==========================================
      - name: Diagnose Kotlin Compilation
        shell: bash
        run: |
          echo "=========================================="
          echo "KOTLIN COMPILATION DIAGNOSTICS"
          echo "=========================================="

          set +e

          gradle :app:compileDebugKotlin \
            --stacktrace \
            --info \
            --console=plain

          KOTLIN_EXIT=$?

          echo ""
          echo "=========================================="
          echo "KOTLIN EXIT CODE: $KOTLIN_EXIT"
          echo "=========================================="

          if [ "$KOTLIN_EXIT" -ne 0 ]; then

            echo ""
            echo "=========================================="
            echo "KOTLIN COMPILATION FAILED"
            echo "=========================================="

            echo ""
            echo "The important error is ABOVE this section."

            echo ""
            echo "Look for lines beginning with:"
            echo "e:"
            echo "error:"
            echo "Unresolved reference"
            echo "Type mismatch"
            echo "Expecting"
            echo "Cannot access"
            echo "Conflicting declarations"
            echo "Redeclaration"

            echo ""
            echo "=========================================="
            echo "KOTLIN SOURCE FILE LIST"
            echo "=========================================="

            find app/src -type f -name "*.kt" | sort

            exit "$KOTLIN_EXIT"
          fi

          echo ""
          echo "KOTLIN COMPILATION PASSED."


      # ==========================================
      # 10. UNIT TESTS
      # ==========================================
      - name: Run Unit Tests
        shell: bash
        run: |
          echo "=========================================="
          echo "RUNNING CHINTU UNIT TESTS"
          echo "=========================================="

          set +e

          gradle test \
            --stacktrace \
            --info \
            --console=plain

          TEST_EXIT=$?

          echo ""
          echo "=========================================="
          echo "UNIT TEST EXIT CODE: $TEST_EXIT"
          echo "=========================================="

          if [ "$TEST_EXIT" -ne 0 ]; then
            echo ""
            echo "UNIT TESTS FAILED."
            echo "See the detailed error above."
            exit "$TEST_EXIT"
          fi

          echo ""
          echo "UNIT TESTS PASSED."


      # ==========================================
      # 11. BUILD APK
      # ==========================================
      - name: Build Debug APK
        shell: bash
        run: |
          echo "=========================================="
          echo "BUILDING CHINTU DEBUG APK"
          echo "=========================================="

          set +e

          gradle assembleDebug \
            --stacktrace \
            --info \
            --console=plain

          BUILD_EXIT=$?

          echo ""
          echo "=========================================="
          echo "APK BUILD EXIT CODE: $BUILD_EXIT"
          echo "=========================================="

          if [ "$BUILD_EXIT" -ne 0 ]; then
            echo ""
            echo "=========================================="
            echo "CHINTU APK BUILD FAILED"
            echo "=========================================="

            echo ""
            echo "Search the log above for:"
            echo "e:"
            echo "error:"
            echo "FAILURE:"
            echo "Unresolved reference"
            echo "Type mismatch"
            echo "Expecting"

            exit "$BUILD_EXIT"
          fi

          echo ""
          echo "CHINTU APK BUILD PASSED."


      # ==========================================
      # 12. VERIFY APK
      # ==========================================
      - name: Verify APK
        shell: bash
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"

          echo "=========================================="
          echo "VERIFYING APK"
          echo "=========================================="

          if [ ! -f "$APK" ]; then
            echo ""
            echo "ERROR: APK NOT FOUND"
            echo "Expected:"
            echo "$APK"
            exit 1
          fi

          echo ""
          echo "=========================================="
          echo "CHINTU APK CREATED SUCCESSFULLY"
          echo "=========================================="

          ls -lh "$APK"


      # ==========================================
      # 13. UPLOAD APK
      # ==========================================
      - name: Upload CHINTU APK
        uses: actions/upload-artifact@v4
        with:
          name: chintu-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error


      # ==========================================
      # 14. FINAL SUMMARY
      # ==========================================
      - name: CHINTU Build Summary
        if: always()
        shell: bash
        run: |
          echo ""
          echo "=========================================="
          echo "           CHINTU BUILD REPORT"
          echo "=========================================="
          echo ""

          if [ -f "app/build/outputs/apk/debug
