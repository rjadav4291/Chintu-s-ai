name: CHINTU Android Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build CHINTU APK
    runs-on: ubuntu-24.04

    steps:

      # -----------------------------------------
      # 1. Checkout source
      # -----------------------------------------
      - name: Checkout source
        uses: actions/checkout@v4


      # -----------------------------------------
      # 2. Java 17
      # -----------------------------------------
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'


      # -----------------------------------------
      # 3. Android SDK
      # -----------------------------------------
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 12266719
          accept-android-sdk-licenses: false
          packages: platform-tools


      # -----------------------------------------
      # 4. Install Android SDK packages
      # -----------------------------------------
      - name: Install Android SDK Platform 35
        shell: bash
        run: |
          set -e

          SDKMANAGER="/usr/local/lib/android/sdk/cmdline-tools/16.0/bin/sdkmanager"

          echo "======================================"
          echo "Checking SDK Manager"
          echo "======================================"

          "$SDKMANAGER" --version

          echo ""
          echo "======================================"
          echo "Installing Android Platform 35"
          echo "======================================"

          set +o pipefail
          yes | "$SDKMANAGER" "platforms;android-35"
          SDK_STATUS=$?
          set -o pipefail

          if [ "$SDK_STATUS" -ne 0 ]; then
            echo "Android Platform 35 installation failed."
            exit "$SDK_STATUS"
          fi

          echo ""
          echo "Android Platform 35 installed successfully."


      # -----------------------------------------
      # 5. Install Build Tools
      # -----------------------------------------
      - name: Install Android Build Tools 35
        shell: bash
        run: |
          set -e

          SDKMANAGER="/usr/local/lib/android/sdk/cmdline-tools/16.0/bin/sdkmanager"

          echo "======================================"
          echo "Installing Build Tools 35.0.0"
          echo "======================================"

          set +o pipefail
          yes | "$SDKMANAGER" "build-tools;35.0.0"
          SDK_STATUS=$?
          set -o pipefail

          if [ "$SDK_STATUS" -ne 0 ]; then
            echo "Android Build Tools installation failed."
            exit "$SDK_STATUS"
          fi

          echo ""
          echo "Android Build Tools 35.0.0 installed successfully."


      # -----------------------------------------
      # 6. Verify Android SDK
      # -----------------------------------------
      - name: Verify Android SDK
        shell: bash
        run: |
          set -e

          SDKMANAGER="/usr/local/lib/android/sdk/cmdline-tools/16.0/bin/sdkmanager"

          echo "======================================"
          echo "ANDROID SDK VERIFICATION"
          echo "======================================"

          "$SDKMANAGER" --list_installed

          echo ""
          echo "Android SDK verification completed."


      # -----------------------------------------
      # 7. Setup Gradle
      # -----------------------------------------
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'


      # -----------------------------------------
      # 8. Check project
      # -----------------------------------------
      - name: Check CHINTU project
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "CHINTU PROJECT CHECK"
          echo "======================================"

          echo ""
          echo "Project files:"
          find . -maxdepth 6 -type f | sort

          echo ""
          echo "Java version:"
          java -version

          echo ""
          echo "Gradle version:"
          gradle --version


      # -----------------------------------------
      # 9. Unit tests
      # -----------------------------------------
      - name: Run unit tests
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "RUNNING CHINTU UNIT TESTS"
          echo "======================================"

          gradle test --stacktrace


      # -----------------------------------------
      # 10. Build APK
      # -----------------------------------------
      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "BUILDING CHINTU DEBUG APK"
          echo "======================================"

          gradle assembleDebug --stacktrace

          echo ""
          echo "CHINTU build command completed."


      # -----------------------------------------
      # 11. Verify APK
      # -----------------------------------------
      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK="app/build/outputs/apk/debug/app-debug.apk"

          echo "======================================"
          echo "VERIFYING CHINTU APK"
          echo "======================================"

          if [ ! -f "$APK" ]; then
            echo ""
            echo "ERROR: CHINTU APK was not created."
            exit 1
          fi

          echo ""
          echo "SUCCESS!"
          echo "CHINTU APK created successfully."
          echo ""

          ls -lh "$APK"


      # -----------------------------------------
      # 12. Upload APK
      # -----------------------------------------
      - name: Upload CHINTU APK
        uses: actions/upload-artifact@v4
        with:
          name: chintu-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error


      # -----------------------------------------
      # 13. Final summary
      # -----------------------------------------
      - name: CHINTU Build Summary
        shell: bash
        run: |
          echo ""
          echo "======================================"
          echo "       CHINTU BUILD SUCCESS"
          echo "======================================"
          echo ""
          echo "APK artifact: chintu-debug-apk"
          echo ""
          echo "======================================"
