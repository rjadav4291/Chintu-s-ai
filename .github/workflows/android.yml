name: CHINTU Android Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build CHINTU APK
    runs-on: ubuntu-24.04

    steps:

      # --------------------------------------------------
      # 1. Checkout
      # --------------------------------------------------
      - name: Checkout source
        uses: actions/checkout@v4


      # --------------------------------------------------
      # 2. Java 17
      # --------------------------------------------------
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'


      # --------------------------------------------------
      # 3. Android SDK
      # --------------------------------------------------
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 12266719
          accept-android-sdk-licenses: false
          packages: platform-tools


      # --------------------------------------------------
      # 4. Android Platform 35
      # --------------------------------------------------
      - name: Install Android Platform 35
        shell: bash
        run: |
          set -e

          SDKMANAGER="/usr/local/lib/android/sdk/cmdline-tools/16.0/bin/sdkmanager"

          echo "================================"
          echo "Installing Android Platform 35"
          echo "================================"

          set +o pipefail
          yes | "$SDKMANAGER" "platforms;android-35"
          STATUS=$?
          set -o pipefail

          if [ "$STATUS" -ne 0 ]; then
            echo "Android Platform installation failed."
            exit "$STATUS"
          fi

          echo "Android Platform 35 installed."


      # --------------------------------------------------
      # 5. Build Tools 35
      # --------------------------------------------------
      - name: Install Android Build Tools 35
        shell: bash
        run: |
          set -e

          SDKMANAGER="/usr/local/lib/android/sdk/cmdline-tools/16.0/bin/sdkmanager"

          echo "================================"
          echo "Installing Build Tools 35.0.0"
          echo "================================"

          set +o pipefail
          yes | "$SDKMANAGER" "build-tools;35.0.0"
          STATUS=$?
          set -o pipefail

          if [ "$STATUS" -ne 0 ]; then
            echo "Build Tools installation failed."
            exit "$STATUS"
          fi

          echo "Build Tools 35.0.0 installed."


      # --------------------------------------------------
      # 6. Gradle
      # --------------------------------------------------
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'


      # --------------------------------------------------
      # 7. Project Check
      # --------------------------------------------------
      - name: Project Check
        shell: bash
        run: |
          echo "================================"
          echo "CHINTU PROJECT CHECK"
          echo "================================"

          echo ""
          echo "Java:"
          java -version

          echo ""
          echo "Gradle:"
          gradle --version

          echo ""
          echo "Kotlin files:"
          find app/src -type f -name '*.kt' -print

          echo ""
          echo "================================"
          echo "PROJECT FILE CHECK COMPLETE"
          echo "================================"


      # --------------------------------------------------
      # 8. Kotlin Compilation
      # --------------------------------------------------
      - name: Kotlin Compilation
        id: kotlin_compile
        shell: bash
        run: |
          echo "================================"
          echo "KOTLIN COMPILATION"
          echo "================================"

          set +e

          gradle :app:compileDebugKotlin \
            --stacktrace \
            --info \
            --console=plain \
            2>&1 | tee kotlin-build.log

          STATUS=${PIPESTATUS[0]}

          echo ""
          echo "================================"
          echo "KOTLIN EXIT CODE: $STATUS"
          echo "================================"

          exit "$STATUS"


      # --------------------------------------------------
      # 9. SHOW KOTLIN ERRORS
      # This step ALWAYS runs
      # --------------------------------------------------
      - name: SHOW KOTLIN ERRORS
        if: always()
        shell: bash
        run: |
          echo ""
          echo "##################################################"
          echo "#              CHINTU ERROR REPORT              #"
          echo "##################################################"
          echo ""

          if [ ! -f kotlin-build.log ]; then
            echo "❌ kotlin-build.log not found."
            echo "The Kotlin compiler log was not created."
            exit 0
          fi

          echo "Searching Kotlin compiler errors..."
          echo ""

          echo "================ FIRST KOTLIN ERRORS ================"

          grep -E '^e: |^e:|^[[:space:]]*e: ' kotlin-build.log \
            | head -80 || true

          echo ""
          echo "================ ERROR FILE / LINE ================"

          grep -E 'e: file:.*:[0-9]+:[0-9]+' kotlin-build.log \
            | head -50 || true

          echo ""
          echo "================ COMMON KOTLIN ERRORS ================"

          grep -Ei \
            'unresolved reference|type mismatch|no value passed|cannot infer|expecting|too many arguments|none of the following|conflicting overloads|redeclaration' \
            kotlin-build.log \
            | head -100 || true

          echo ""
          echo "================ WARNINGS ================"

          grep -E '^w: |^w:' kotlin-build.log \
            | head -50 || true

          echo ""
          echo "##################################################"
          echo "#              END ERROR REPORT                  #"
          echo "##################################################"


      # --------------------------------------------------
      # 10. Unit Tests
      # Only runs if Kotlin compilation succeeded
      # --------------------------------------------------
      - name: Run Unit Tests
        if: success()
        shell: bash
        run: |
          echo "================================"
          echo "RUNNING UNIT TESTS"
          echo "================================"

          gradle test \
            --stacktrace \
            --info \
            --console=plain


      # --------------------------------------------------
      # 11. Build APK
      # --------------------------------------------------
      - name: Build Debug APK
        if: success()
        shell: bash
        run: |
          echo "================================"
          echo "BUILDING CHINTU APK"
          echo "================================"

          gradle assembleDebug \
            --stacktrace \
            --info \
            --console=plain


      # --------------------------------------------------
      # 12. Verify APK
      # --------------------------------------------------
      - name: Verify APK
        if: success()
        shell: bash
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"

          echo "================================"
          echo "APK VERIFICATION"
          echo "================================"

          if [ ! -f "$APK" ]; then
            echo "❌ APK NOT FOUND"
            exit 1
          fi

          echo ""
          echo "✅ CHINTU APK CREATED"
          ls -lh "$APK"

          echo ""
          echo "APK PATH:"
          echo "$APK"


      # --------------------------------------------------
      # 13. Upload APK
      # --------------------------------------------------
      - name: Upload CHINTU APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: chintu-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
