name: CHINTU Android Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build CHINTU APK
    runs-on: ubuntu-24.04

    steps:

      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 12266719
          accept-android-sdk-licenses: false
          packages: platform-tools

      - name: Install Android Platform 35
        shell: bash
        run: |
          set -e
          SDKMANAGER="/usr/local/lib/android/sdk/cmdline-tools/16.0/bin/sdkmanager"

          echo "Installing Android Platform 35..."

          set +o pipefail
          yes | "$SDKMANAGER" "platforms;android-35"
          STATUS=$?
          set -o pipefail

          if [ "$STATUS" -ne 0 ]; then
            echo "Android Platform 35 installation failed."
            exit "$STATUS"
          fi

          echo "Android Platform 35 installed."

      - name: Install Android Build Tools 35
        shell: bash
        run: |
          set -e
          SDKMANAGER="/usr/local/lib/android/sdk/cmdline-tools/16.0/bin/sdkmanager"

          echo "Installing Build Tools 35.0.0..."

          set +o pipefail
          yes | "$SDKMANAGER" "build-tools;35.0.0"
          STATUS=$?
          set -o pipefail

          if [ "$STATUS" -ne 0 ]; then
            echo "Build Tools installation failed."
            exit "$STATUS"
          fi

          echo "Build Tools 35.0.0 installed."

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Project Check
        shell: bash
        run: |
          echo "================================"
          echo "CHINTU PROJECT CHECK"
          echo "================================"

          echo "Java:"
          java -version

          echo ""
          echo "Gradle:"
          gradle --version

          echo ""
          echo "Kotlin files:"
          find app/src -type f -name '*.kt' -print

      - name: Kotlin Compilation Diagnostic
        shell: bash
        run: |
          echo "================================"
          echo "KOTLIN COMPILATION DIAGNOSTIC"
          echo "================================"

          set +e

          gradle :app:compileDebugKotlin --stacktrace --info --console=plain

          STATUS=$?

          echo ""
          echo "================================"
          echo "KOTLIN COMPILER EXIT CODE: $STATUS"
          echo "================================"

          if [ "$STATUS" -ne 0 ]; then
            echo ""
            echo "KOTLIN COMPILATION FAILED."
            echo ""
            echo "Look ABOVE for the FIRST line beginning with:"
            echo "e:"
            echo ""
            echo "That line contains the real Kotlin error."
            exit "$STATUS"
          fi

          echo ""
          echo "KOTLIN COMPILATION PASSED."

      - name: Run Unit Tests
        shell: bash
        run: |
          echo "================================"
          echo "RUNNING UNIT TESTS"
          echo "================================"

          gradle test --stacktrace --info --console=plain

      - name: Build Debug APK
        shell: bash
        run: |
          echo "================================"
          echo "BUILDING CHINTU APK"
          echo "================================"

          gradle assembleDebug --stacktrace --info --console=plain

      - name: Verify APK
        shell: bash
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"

          echo "================================"
          echo "VERIFYING APK"
          echo "================================"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not created."
            exit 1
          fi

          echo ""
          echo "CHINTU APK CREATED SUCCESSFULLY"
          echo ""

          ls -lh "$APK"

      - name: Upload CHINTU APK
        uses: actions/upload-artifact@v4
        with:
          name: chintu-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Final Status
        if: always()
        shell: bash
        run: |
          echo "================================"
          echo "CHINTU BUILD FINISHED"
          echo "================================"

          if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "STATUS: APK CREATED"
          else
            echo "STATUS: APK NOT CREATED"
          fi
