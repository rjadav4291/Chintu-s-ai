name: CHINTU Android Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build CHINTU APK
    runs-on: ubuntu-24.04

    steps:

      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 12266719
          accept-android-sdk-licenses: false
          packages: platform-tools

      - name: Install Android SDK Platform 35
        shell: bash
        run: |
          set -e

          SDKMANAGER="/usr/local/lib/android/sdk/cmdline-tools/16.0/bin/sdkmanager"

          echo "Checking SDK Manager..."
          "$SDKMANAGER" --version

          echo "Installing Android Platform 35..."
          yes | "$SDKMANAGER" "platforms;android-35"

          echo "Installing Android Build Tools 35.0.0..."
          yes | "$SDKMANAGER" "build-tools;35.0.0"

          echo "Android SDK installation completed."

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Check CHINTU project
        shell: bash
        run: |
          echo "========== PROJECT FILES =========="
          find . -maxdepth 6 -type f | sort

          echo "========== JAVA =========="
          java -version

          echo "========== GRADLE =========="
          gradle --version

      - name: Run unit tests
        shell: bash
        run: |
          echo "Running CHINTU unit tests..."
          gradle test --stacktrace

      - name: Build Debug APK
        shell: bash
        run: |
          echo "======================================"
          echo "BUILDING CHINTU APK"
          echo "======================================"

          gradle assembleDebug --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: CHINTU APK was not created."
            exit 1
          fi

          echo "======================================"
          echo "CHINTU APK CREATED SUCCESSFULLY"
          echo "======================================"

          ls -lh "$APK"

      - name: Upload CHINTU APK
        uses: actions/upload-artifact@v4
        with:
          name: chintu-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Build Summary
        shell: bash
        run: |
          echo "======================================"
          echo "CHINTU BUILD COMPLETED"
          echo "======================================"
          echo "Artifact: chintu-debug-apk"
