name: CHINTU Android Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build CHINTU APK
    runs-on: ubuntu-24.04

    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -e

          SDKMANAGER="/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -f "$SDKMANAGER" ]; then
            echo "sdkmanager not found at:"
            echo "$SDKMANAGER"
            find /usr/local/lib/android/sdk/cmdline-tools -maxdepth 3 -type f -name sdkmanager -print || true
            exit 1
          fi

          echo "Accepting Android SDK licenses..."

          yes | "$SDKMANAGER" --licenses

          echo "Installing required Android SDK packages..."

          "$SDKMANAGER" "platform-tools"
          "$SDKMANAGER" "platforms;android-35"
          "$SDKMANAGER" "build-tools;35.0.0"

      - name: Verify Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          sdkmanager --version
          adb version
          ls -la "$ANDROID_SDK_ROOT/platforms/android-35"
          ls -la "$ANDROID_SDK_ROOT/build-tools/35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Check project
        shell: bash
        run: |
          echo "Checking CHINTU project..."
          find . -maxdepth 8 -type f | sort

      - name: Run unit tests
        shell: bash
        run: |
          gradle test --stacktrace

      - name: Build Debug APK
        shell: bash
        run: |
          gradle assembleDebug --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          echo "======================================"
          echo "CHINTU APK BUILD SUCCESSFUL"
          echo "======================================"
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload CHINTU APK
        uses: actions/upload-artifact@v4
        with:
          name: chintu-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
